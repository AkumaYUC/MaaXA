name: install

env:
  # MAAFW_VERSION 必须钉死具体版本，不要留空！
  # 留空 = 跟随上游 latest，会让 GUI 原生库自己漂到比 agent 绑定更新的一代，
  # agent 启动握手即失败退出（现象是「Agent 连接失败」，且构建全程绿灯、只有用户装上才炸）。
  # 改这里时，必须同步改 agent 的依赖钉扎（当前是 agent/requirements.txt 的 maafw==）。
  MAAFW_VERSION: "v5.12.3"
  # 注意：GUI 不再从上游仓库下载预编译版，改为在本仓库源码编译（见 build job）。

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "agent/**"
      - "gui/**"
      - "tools/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "agent/**"
      - "gui/**"
      - "tools/**"
      - "**.py"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        # 更新日志生成失败不阻塞发版（release 的 body 会退回默认文案）
        continue-on-error: true
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          # 不要加 -vv：它会把日志灌满 TLS 调试输出，真出错时反而看不见原因
          args: >-
            --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [meta, changelog]
    # 本项目只面向 Windows（金蝶云客户端），GUI 源码编译与便携 Python 也都只在 Windows 上有意义，
    # 因此不跑平台矩阵。构建与发版合并成同一个 job：用 artifact 在 job 间中转大文件，
    # 很容易被存储配额和配额重算延迟卡住发版流程。
    runs-on: windows-latest
    permissions:
      # 仓库的默认 workflow 权限是 read，创建 Release 会被 403（Resource not accessible by integration）拒绝，
      # 这里显式提权；其余 job 不需要写权限，按最小权限原则只在 build 声明
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build MFAAvalonia
        shell: pwsh
        # -o 显式指定输出目录，避免依赖 csproj 里 $(Platform) 的实际取值
        run: dotnet publish gui/MFAAvalonia/MFAAvalonia.Desktop/MFAAvalonia.Desktop.csproj -c Release -r win-x64 --self-contained false -o gui-publish

      - name: Remove built-in runtime in GUI
        shell: pwsh
        # GUI 自带的 runtimes 来自 NuGet 包，这里删掉，改用 install.py 从 MaaFramework release 铺的那份，
        # 保证 GUI 与 agent 用的是同一套原生库
        run: Remove-Item -Recurse -Force gui-publish/runtimes -ErrorAction SilentlyContinue

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-win-x86_64*"
          # 只认 MAAFW_VERSION，不要加 latest 回退：回退会让「变量被清空」静默变回跟随上游
          tag: ${{ env.MAAFW_VERSION }}
          out-file-path: "deps"
          extract: true

      - name: Install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path install | Out-Null
          Copy-Item -Recurse -Force "gui-publish/*" install/
          cd tools
          python -m pip install -r ./requirements.txt
          python ./install.py ${{ needs.meta.outputs.tag }} win x86_64

      - name: Verify MaaFramework natives match
        shell: pwsh
        # 包里凡是有第二份 MaaFramework.dll（agent 侧绑定自带的那份），必须与 deps 那份完全一致，
        # 否则 GUI 与 agent 协议号会差一代、agent 启动握手即失败，而构建全程绿灯。
        # 只能比文件、不能比版本号：实测 MaaFramework.dll 没有版本资源，FileVersion/ProductVersion 都是空的。
        run: |
          $dlls = Get-ChildItem -Path install -Recurse -Filter MaaFramework.dll
          if (-not $dlls) { throw "install 里一个 MaaFramework.dll 都没找到，打包产物不完整" }

          $hashes = $dlls | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash } | Sort-Object -Unique
          if ($hashes.Count -ne 1) {
            $dlls | ForEach-Object { Write-Host "$($_.FullName)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" }
            throw "包里有 $($hashes.Count) 份不一致的 MaaFramework.dll，说明 GUI 与 agent 用的不是同一个框架版本"
          }

          Write-Host "MaaFramework 原生库一致：$($hashes[0])"

      - name: Package
        if: ${{ needs.meta.outputs.is_release == 'true' }}
        shell: pwsh
        run: Compress-Archive -Path install/* -DestinationPath "MaaXA-win-x86_64-${{ needs.meta.outputs.tag }}.zip"

      - name: Create release
        if: ${{ needs.meta.outputs.is_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: "MaaXA-win-x86_64-*.zip"
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body || '详见提交记录。' }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

      # Mirror酱为第三方分发服务，新项目默认关闭
      # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
      # https://mirrorchyan.com/
      - name: Trigger MirrorChyanUploading
        if: false
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
